name: Dashboard checks and deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check web/static/app.js
      - run: python scripts/package-web.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-${{ github.sha }}
          path: dist/web.zip
          if-no-files-found: error
          retention-days: 30

  collector-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/ReleaseVerification --configuration Release
      - run: dotnet build collector/SysTracker.Collector.csproj --configuration Release

  deploy:
    needs: [checks, collector-checks]
    if: >-
      github.repository == 'CheeseHeadChris96/SysTracker' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://systracker.hbstest.com
    concurrency:
      group: systracker-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Validate deployment settings
        run: |
          test -n "$AZURE_WEBAPP_NAME"
          test -n "$AZURE_RESOURCE_GROUP"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-${{ github.sha }}
          path: dist
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy tested package
        run: >-
          az webapp deploy
          --resource-group "$AZURE_RESOURCE_GROUP"
          --name "$AZURE_WEBAPP_NAME"
          --src-path dist/web.zip
          --type zip
      - name: Check dashboard startup
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 --max-time 30 \
            https://systracker.hbstest.com/health > /tmp/systracker-health.json
          python -c 'import json; assert json.load(open("/tmp/systracker-health.json"))["status"] == "ok"'
